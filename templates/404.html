<section class="hero hero-404">
  <div class="hero-inner">
    <p class="kicker reveal">{{brand_tagline}}</p>
    <h1 class="hero-title reveal">{{notfound_title}}</h1>
    <p class="hero-lead reveal">{{notfound_lead}}</p>
    <div class="hero-cta reveal">
      <a class="privacy-cta" href="{{nav_home}}"><span class="privacy-cta-glyph" aria-hidden="true">{{arrow_glyph}}</span>{{notfound_cta}}</a>
    </div>
  </div>
  <div class="hero-wave reveal" aria-hidden="true">
    {{hero_wave}}
  </div>
</section>
